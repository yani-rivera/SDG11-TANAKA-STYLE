# Tanaka (illuminated contours) pipeline configuration.
# Place names and bounding boxes live in catalogs/areas.csv, not here.

area_id: TGU
areas_catalog: catalogs/areas.csv

dem:
  # "copernicus" reads Copernicus GLO-30 COG tiles over HTTPS (only the window needed).
  # "local" reads a GeoTIFF from local_path (any CRS; it is reprojected).
  source: copernicus
  local_path: data/raw/dem.tif
  copernicus_url_template: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif"
  cache_dir: data/raw
  resolution_m: 30

preprocess:
  smooth_sigma_px: 1.5      # Gaussian smoothing before contouring (0 = off)

contours:
  interval_m: 25            # contour spacing
  min_vertices: 6           # drop tiny contour fragments

tanaka:
  light_azimuth_deg: 315    # direction the light comes FROM (315 = northwest)
  light_color: "#f4f1e8"
  dark_color: "#1b2433"
  width_min: 0.15
  width_max: 0.9

shadow:
  mode: lines               # none | lines (drop shadow under contours) | terrace (stepped paper layers)
  # Stack as many layers as you like (like QGIS draw effects). First = closest to the lines.
  # distance_pt: how far it falls, away from the light; alpha: strength;
  # softness_steps: stacked copies (more = softer); width_scale: lines mode only.
  layers:
    - { color: "#0d1418", alpha: 0.35, distance_pt: 0.8, softness_steps: 2, width_scale: 1.2 }
    - { color: "#0d1418", alpha: 0.15, distance_pt: 2.5, softness_steps: 4, width_scale: 2.0 }

render:
  fill_colormap: [ "#5d7a72", "#8a9a7b", "#b5ab86", "#cdbb98", "#e2d6c0" ]
  fill_alpha: 1.0
  background: "#2b3a42"
  title_color: "#f4f1e8"
  figure_width_in: 10
  dpi: 300
  formats: [png]
  credits: >-
    Copernicus DEM GLO-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018,
    provided under COPERNICUS by the European Union and ESA

output:
  dir: output
  run_log: output/run_log.csv
